<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Chrome/Cyan Glow Gradient -->
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Cut Accent Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="4" />

  <!-- Puzzle Piece Glyph (Chrome Extension Symbol) with Shadow -->
  <g filter="url(#subtleShadow)">
    <path d="M 210 140 
             C 210 115, 230 95, 256 95 
             C 282 95, 302 115, 302 140 
             L 360 140 
             A 16 16 0 0 1 376 156 
             L 376 210 
             C 401 210, 421 230, 421 256 
             C 421 282, 401 302, 376 302 
             L 376 356 
             A 16 16 0 0 1 360 372 
             L 302 372 
             C 302 347, 282 327, 256 327 
             C 230 327, 210 347, 210 372 
             L 152 372 
             A 16 16 0 0 1 136 356 
             L 136 302 
             C 161 302, 181 282, 181 256 
             C 181 230, 161 210, 136 210 
             L 136 156 
             A 16 16 0 0 1 152 140 
             Z" 
          fill="url(#puzzleGrad)" />
  </g>

  <!-- Dynamic Diagonal Removal Slash -->
  <path d="M 120 400 L 392 112" 
        stroke="url(#slashGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#subtleShadow)" />
        
  <!-- Minimal Severing Accents -->
  <circle cx="392" cy="112" r="7" fill="#ffffff" />
  <circle cx="120" cy="400" r="7" fill="#ffffff" />
</svg>
